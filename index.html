<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Galore Closet</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Cor da barra no Android -->
  <meta name="theme-color" content="#ec4899" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-pink-50">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center text-center px-6">
          <img
            src="icon.png"
            alt="Galore Closet"
            className="w-32 h-32 rounded-2xl shadow-lg mb-6"
          />

          <h1 className="text-3xl font-bold text-pink-600 mb-2">
            Galore Closet
          </h1>

          <p className="text-pink-500 max-w-sm mb-8">
            Meu closet digital ✨  
            Um app só meu, do meu jeitinho.
          </p>

          <button
            className="bg-pink-500 text-white px-6 py-3 rounded-full shadow hover:bg-pink-600 transition"
            onClick={() => alert("Bem-vinda 💖")}
          >
            Entrar
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
