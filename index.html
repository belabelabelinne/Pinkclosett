<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configurações de Web App para iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pink Closet">
    
    <title>Pink Closet Galore</title>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff0f6;
            -webkit-tap-highlight-color: transparent;
            color: #ff4d94;
        }

        .bg-pattern {
            background-image: radial-gradient(#ffb3d9 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .pinterest-card {
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }

        .look-stack {
            position: relative;
        }

        .look-stack::before {
            content: '';
            position: absolute;
            top: -8px; left: 8px; right: 8px; bottom: 8px;
            background: white;
            border-radius: 2rem;
            z-index: -1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop 0.3s ease-out forwards;
        }

        /* Ajuste para iPhones modernos (Notch) */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        /* Esconder scrollbar mas manter funcionalidade */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-pattern">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icons = {
            HelloKitty: () => (
                <svg width="35" height="35" viewBox="0 0 100 100" fill="none">
                    <path d="M50 85c25 0 40-15 40-30s-10-30-40-30-40 15-40 30 15 30 40 30z" fill="white" stroke="#ff85c0" strokeWidth="4"/>
                    <path d="M25 35c0-10 5-20 15-20l5 10c0 0-10 0-20 10z" fill="#ff4d94" stroke="#ff4d94" strokeWidth="2"/>
                    <circle cx="35" cy="50" r="4" fill="#333"/>
                    <circle cx="65" cy="50" r="4" fill="#333"/>
                    <ellipse cx="50" cy="58" rx="6" ry="4" fill="#ffcc00"/>
                </svg>
            ),
            MyMelody: () => (
                <svg width="30" height="30" viewBox="0 0 100 100" fill="none">
                    <path d="M50 90c20 0 35-15 35-35 0-15-5-25-15-30V15c0-5-5-10-10-10H40c-5 0-10 5-10 10v10c-10 5-15 15-15 30 0 20 15 35 35 35z" fill="#ff85c0" stroke="#ff4d94" strokeWidth="3"/>
                    <rect x="35" y="45" width="30" height="25" rx="15" fill="white" />
                    <circle cx="42" cy="58" r="3" fill="#333"/>
                    <circle cx="58" cy="58" r="3" fill="#333"/>
                    <ellipse cx="50" cy="63" rx="4" ry="3" fill="#ffcc00"/>
                </svg>
            ),
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Arrow: ({ dir }) => (
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" className={dir === 'left' ? '' : 'rotate-180'}>
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            ),
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>,
            Save: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path></svg>,
            External: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
            Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        };

        const App = () => {
            const [lang, setLang] = useState('pt');
            const [closetName, setClosetName] = useState('GALORE CLOSET');
            const [isEditingName, setIsEditingName] = useState(false);
            const [items, setItems] = useState([]);
            const [wishlist, setWishlist] = useState([]);
            const [savedOutfits, setSavedOutfits] = useState([]);
            const [activeTab, setActiveTab] = useState('dresser'); 
            const [indices, setIndices] = useState({ Top: 0, Bottom: 0, Shoes: 0, Dress: 0 });
            const [isDressMode, setIsDressMode] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isOutfitModalOpen, setIsOutfitModalOpen] = useState(false);
            const [isWishlistModalOpen, setIsWishlistModalOpen] = useState(false);
            const [outfitName, setOutfitName] = useState('');
            const [newItem, setNewItem] = useState({ name: '', category: 'Top', image: '' });
            const [wishItem, setWishItem] = useState({ name: '', link: '', image: '' });

            // Carregar dados
            useEffect(() => {
                const saved = localStorage.getItem('closet_data_v3');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setItems(parsed.items || []);
                    setWishlist(parsed.wishlist || []);
                    setSavedOutfits(parsed.savedOutfits || []);
                    setClosetName(parsed.closetName || 'GALORE CLOSET');
                }
            }, []);

            // Salvar dados automaticamente
            useEffect(() => {
                localStorage.setItem('closet_data_v3', JSON.stringify({ items, wishlist, savedOutfits, closetName }));
            }, [items, wishlist, savedOutfits, closetName]);

            const t = {
                pt: { vestir: "VESTIR", itens: "ITENS", looks: "COLEÇÃO", wishlist: "WISHLIST", modoSeparado: "✿ PEÇAS ✿", modoVestido: "✿ VESTIDO ✿", vazio: "ESTÁ VAZIO... ✿", novoItem: "NOVO ITEM", cancelar: "CANCELAR", salvarLook: "SALVAR LOOK", nomeLook: "NOME DO LOOK...", idioma: "EN", addWish: "ADICIONAR DESEJO", comprar: "COMPRAR" },
                en: { vestir: "DRESS", itens: "ITEMS", looks: "OUTFITS", wishlist: "WISHES", modoSeparado: "✿ SEPARATES ✿", modoVestido: "✿ DRESS MODE ✿", vazio: "IT'S EMPTY... ✿", novoItem: "NEW ITEM", cancelar: "CANCEL", salvarLook: "SAVE LOOK", nomeLook: "OUTFIT NAME...", idioma: "PT", addWish: "ADD WISH", comprar: "SHOP" }
            }[lang];

            const categorized = useMemo(() => ({
                Top: items.filter(i => i.category === 'Top'),
                Bottom: items.filter(i => i.category === 'Bottom'),
                Shoes: items.filter(i => i.category === 'Shoes'),
                Dress: items.filter(i => i.category === 'Dress'),
            }), [items]);

            const cycle = (cat, direction) => {
                const list = categorized[cat];
                if (!list.length) return;
                setIndices(prev => {
                    let next = direction === 'next' ? prev[cat] + 1 : prev[cat] - 1;
                    if (next >= list.length) next = 0;
                    if (next < 0) next = list.length - 1;
                    return { ...prev, [cat]: next };
                });
            };

            const handleFileUpload = (e, type) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (type === 'item') setNewItem({...newItem, image: reader.result});
                        else setWishItem({...wishItem, image: reader.result});
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="min-h-screen pb-24 no-scrollbar">
                    {/* Header Premium */}
                    <header className="bg-pink-100 border-b-[6px] border-pink-300 p-6 sticky top-0 z-50 rounded-b-[3.5rem] shadow-lg safe-top">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <div className="flex flex-col">
                                <div className="flex items-center gap-2" onClick={() => setIsEditingName(true)}>
                                    <Icons.HelloKitty />
                                    {isEditingName ? (
                                        <input autoFocus className="bg-white/50 border-b-2 border-pink-500 outline-none text-lg font-black text-pink-500 uppercase w-32" value={closetName} onChange={(e) => setClosetName(e.target.value)} onBlur={() => setIsEditingName(false)} />
                                    ) : (
                                        <h1 className="text-lg font-black tracking-tighter text-pink-500 uppercase flex items-center gap-2">{closetName} <Icons.Edit /></h1>
                                    )}
                                </div>
                                <button onClick={() => setLang(lang === 'pt' ? 'en' : 'pt')} className="text-[10px] font-black text-pink-400 mt-1">{t.idioma}</button>
                            </div>
                            <button onClick={() => activeTab === 'wishlist' ? setIsWishlistModalOpen(true) : setIsModalOpen(true)} className="bg-pink-500 text-white w-12 h-12 rounded-2xl border-4 border-white shadow-lg flex items-center justify-center active:scale-90 transition-transform">
                                <Icons.Plus />
                            </button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto p-4 pt-6">
                        {/* Navegação estilo App */}
                        <div className="grid grid-cols-4 gap-2 mb-8">
                            {['dresser', 'gallery', 'looks', 'wishlist'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`py-3 rounded-2xl font-black text-[9px] border-b-4 transition-all ${activeTab === tab ? 'bg-pink-500 text-white border-pink-700 -translate-y-1 shadow-lg' : 'bg-pink-200 text-pink-500 border-pink-300'}`}>
                                    {t[tab === 'dresser' ? 'vestir' : tab === 'gallery' ? 'itens' : tab]}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'dresser' && (
                            <div className="flex flex-col items-center space-y-6 animate-pop">
                                <div className="flex gap-2 w-full">
                                    <button onClick={() => setIsDressMode(!isDressMode)} className="flex-1 py-4 bg-white border-4 border-pink-300 rounded-[2rem] font-black text-pink-500 shadow-sm">{isDressMode ? t.modoSeparado : t.modoVestido}</button>
                                    <button onClick={() => setIsOutfitModalOpen(true)} className="bg-pink-500 text-white px-6 rounded-[2rem] border-4 border-white shadow-md active:scale-95"><Icons.Save /></button>
                                </div>

                                <div className="w-full space-y-4 bg-pink-100/60 p-6 rounded-[4rem] border-4 border-white shadow-xl relative">
                                    {!isDressMode ? (
                                        <>
                                            <SimsSlot title="TOP" list={categorized.Top} idx={indices.Top} onCycle={(d) => cycle('Top', d)} h="h-64" />
                                            <SimsSlot title="BOTTOM" list={categorized.Bottom} idx={indices.Bottom} onCycle={(d) => cycle('Bottom', d)} h="h-72" />
                                        </>
                                    ) : (
                                        <SimsSlot title="DRESS" list={categorized.Dress} idx={indices.Dress} onCycle={(d) => cycle('Dress', d)} h="h-[450px]" />
                                    )}
                                    <SimsSlot title="SHOES" list={categorized.Shoes} idx={indices.Shoes} onCycle={(d) => cycle('Shoes', d)} h="h-44" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'gallery' && (
                            <div className="columns-2 gap-4 space-y-4 animate-pop">
                                {items.map(i => (
                                    <div key={i.id} className="bg-white p-3 rounded-[2rem] border-4 border-pink-100 shadow-sm pinterest-card">
                                        <div className="rounded-[1.5rem] overflow-hidden bg-pink-50 aspect-[3/4]">
                                            <img src={i.image} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="mt-2 flex justify-between items-center px-1">
                                            <span className="text-[9px] font-black text-pink-500 truncate uppercase">{i.name}</span>
                                            <button onClick={() => setItems(items.filter(x => x.id !== i.id))} className="text-pink-100"><Icons.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                                {items.length === 0 && <EmptyState t={t} />}
                            </div>
                        )}

                        {activeTab === 'looks' && (
                            <div className="columns-2 gap-4 space-y-6 animate-pop">
                                {savedOutfits.map(o => (
                                    <div key={o.id} className="look-stack pinterest-card">
                                        <div className="bg-white p-2 rounded-[2.5rem] border-4 border-pink-100 shadow-md">
                                            <div className="grid grid-cols-2 gap-1 rounded-2xl overflow-hidden bg-pink-50 h-36">
                                                {o.items.map((item, idx) => <img key={idx} src={item.image} className="w-full h-full object-cover" />)}
                                            </div>
                                            <div className="mt-3 px-2">
                                                <p className="text-[10px] font-black text-pink-500 truncate uppercase">{o.name}</p>
                                                <button onClick={() => setSavedOutfits(savedOutfits.filter(x => x.id !== o.id))} className="text-pink-100 mt-1"><Icons.Trash /></button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'wishlist' && (
                            <div className="columns-2 gap-4 space-y-4 animate-pop">
                                {wishlist.map(w => (
                                    <div key={w.id} className="bg-white p-3 rounded-[2.5rem] border-4 border-pink-100 shadow-sm pinterest-card">
                                        <div className="rounded-[2rem] overflow-hidden relative">
                                            <img src={w.image} className="w-full h-auto object-cover" />
                                            {w.link && <a href={w.link} target="_blank" className="absolute bottom-2 right-2 bg-pink-500 text-white p-2 rounded-full shadow-lg"><Icons.External /></a>}
                                        </div>
                                        <div className="mt-2 px-1 flex justify-between">
                                            <p className="text-[9px] font-black text-pink-500 uppercase">{w.name}</p>
                                            <button onClick={() => setWishlist(wishlist.filter(x => x.id !== w.id))} className="text-pink-100"><Icons.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Modais Premium */}
                    {isModalOpen && (
                        <Modal onClose={() => setIsModalOpen(false)} title={t.novoItem} icon={<Icons.MyMelody />}>
                            <div className="flex flex-wrap gap-2 justify-center mb-4">
                                {['Top', 'Bottom', 'Dress', 'Shoes'].map(c => (
                                    <button key={c} onClick={() => setNewItem({...newItem, category: c})} className={`px-4 py-2 rounded-full text-[9px] font-black border-2 ${newItem.category === c ? 'bg-pink-500 border-pink-500 text-white' : 'bg-pink-50 border-pink-100 text-pink-300'}`}>{c.toUpperCase()}</button>
                                ))}
                            </div>
                            <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4" onClick={() => document.getElementById('file-upload').click()}>
                                {newItem.image ? <img src={newItem.image} className="w-full h-full object-cover" /> : <Icons.Plus />}
                                <input id="file-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'item')} />
                            </div>
                            <input placeholder="NOME..." className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-6" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value.toUpperCase()})} />
                            <button onClick={() => { if(!newItem.image || !newItem.name) return; setItems([{...newItem, id: Date.now()}, ...items]); setIsModalOpen(false); }} className="w-full bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg uppercase text-xs">Salvar</button>
                        </Modal>
                    )}

                    {isOutfitModalOpen && (
                        <Modal onClose={() => setIsOutfitModalOpen(false)} title={t.salvarLook} icon={<Icons.HelloKitty />}>
                            <input autoFocus placeholder={t.nomeLook} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-600 font-black border-2 border-pink-100 outline-none text-center mb-6" value={outfitName} onChange={e => setOutfitName(e.target.value.toUpperCase())} />
                            <button onClick={() => {
                                const outfitItems = isDressMode ? [categorized.Dress[indices.Dress], categorized.Shoes[indices.Shoes]] : [categorized.Top[indices.Top], categorized.Bottom[indices.Bottom], categorized.Shoes[indices.Shoes]];
                                setSavedOutfits([{ id: Date.now(), name: outfitName, items: outfitItems.filter(i => i) }, ...savedOutfits]);
                                setOutfitName(''); setIsOutfitModalOpen(false);
                            }} className="w-full bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-xl">OK</button>
                        </Modal>
                    )}

                    {isWishlistModalOpen && (
                        <Modal onClose={() => setIsWishlistModalOpen(false)} title={t.addWish} icon={<Icons.HelloKitty />}>
                            <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4" onClick={() => document.getElementById('wish-upload').click()}>
                                {wishItem.image ? <img src={wishItem.image} className="w-full h-full object-cover" /> : <Icons.Plus />}
                                <input id="wish-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'wish')} />
                            </div>
                            <input placeholder="NOME..." className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-3" value={wishItem.name} onChange={e => setWishItem({...wishItem, name: e.target.value.toUpperCase()})} />
                            <input placeholder="LINK (OPCIONAL)..." className="w-full p-4 bg-pink-50 rounded-2xl text-pink-300 font-black border-2 border-pink-100 outline-none mb-6" value={wishItem.link} onChange={e => setWishItem({...wishItem, link: e.target.value})} />
                            <button onClick={() => { if(!wishItem.image || !wishItem.name) return; setWishlist([{...wishItem, id: Date.now()}, ...wishlist]); setIsWishlistModalOpen(false); }} className="w-full bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg">ADICIONAR</button>
                        </Modal>
                    )}
                </div>
            );
        };

        const SimsSlot = ({ title, list, idx, onCycle, h }) => (
            <div className={`relative ${h} bg-white rounded-[3rem] border-[6px] border-white shadow-inner overflow-hidden flex items-center justify-center`}>
                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10 bg-pink-500 text-white px-5 py-1 rounded-full text-[9px] font-black tracking-widest shadow-sm">{title}</div>
                {list.length > 0 ? (
                    <>
                        <img src={list[idx].image} className="w-full h-full object-cover" />
                        <div className="absolute inset-x-2 top-1/2 -translate-y-1/2 flex justify-between px-1">
                            <button onClick={() => onCycle('prev')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="left" /></button>
                            <button onClick={() => onCycle('next')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="next" /></button>
                        </div>
                    </>
                ) : <div className="text-pink-100 font-black text-[10px]">VAZIO</div>}
            </div>
        );

        const Modal = ({ children, title, icon, onClose }) => (
            <div className="fixed inset-0 bg-pink-400/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-4">
                <div className="bg-white w-full max-w-sm rounded-[3.5rem] border-[8px] border-white shadow-2xl p-8 mb-4 sm:mb-0">
                    <div className="flex justify-center mb-2">{icon}</div>
                    <h2 className="text-center font-black text-pink-500 uppercase mb-6 tracking-widest">{title}</h2>
                    {children}
                    <button onClick={onClose} className="w-full mt-4 text-[10px] font-black text-pink-200 uppercase">Fechar</button>
                </div>
            </div>
        );

        const EmptyState = ({ t }) => (
            <div className="col-span-full py-20 text-center text-pink-200 font-black italic flex flex-col items-center">
                <Icons.MyMelody /><span className="mt-4">{t.vazio}</span>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
