<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galore Closet</title>
    <!-- Scripts necessários para o seu código React funcionar no navegador -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // O TEU CÓDIGO ORIGINAL COMEÇA AQUI
        const { useState, useMemo, useEffect } = React;

        const styleSheet = `
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');

        body {
          font-family: 'Quicksand', sans-serif;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
        }

        .bg-pattern {
          background-color: #fff0f6;
          background-image: radial-gradient(#ffb3d9 1.5px, transparent 1.5px);
          background-size: 24px 24px;
        }

        .pinterest-card {
          break-inside: avoid;
          margin-bottom: 1.5rem;
        }

        .scroll-hide::-webkit-scrollbar {
          display: none;
        }

        .active-tab-glow {
          box-shadow: 0 0 15px rgba(255, 77, 148, 0.4);
        }

        .look-stack {
          position: relative;
        }

        .look-stack::before {
          content: '';
          position: absolute;
          top: -8px;
          left: 8px;
          right: 8px;
          bottom: 8px;
          background: white;
          border-radius: 2rem;
          z-index: -1;
          box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        @keyframes pop {
          0% { transform: scale(0.95); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
          animation: pop 0.3s ease-out forwards;
        }
        `;

        const Icons = {
          HelloKitty: () => (
            <svg width="35" height="35" viewBox="0 0 100 100" fill="none">
              <path d="M50 85c25 0 40-15 40-30s-10-30-40-30-40 15-40 30 15 30 40 30z" fill="white" stroke="#ff85c0" strokeWidth="4"/>
              <path d="M25 35c0-10 5-20 15-20l5 10c0 0-10 0-20 10z" fill="#ff4d94" stroke="#ff4d94" strokeWidth="2"/>
              <circle cx="35" cy="50" r="4" fill="#333"/>
              <circle cx="65" cy="50" r="4" fill="#333"/>
              <ellipse cx="50" cy="58" rx="6" ry="4" fill="#ffcc00"/>
            </svg>
          ),
          MyMelody: () => (
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none">
              <path d="M50 90c20 0 35-15 35-35 0-15-5-25-15-30V15c0-5-5-10-10-10H40c-5 0-10 5-10 10v10c-10 5-15 15-15 30 0 20 15 35 35 35z" fill="#ff85c0" stroke="#ff4d94" strokeWidth="3"/>
              <rect x="35" y="45" width="30" height="25" rx="15" fill="white" />
              <circle cx="42" cy="58" r="3" fill="#333"/>
              <circle cx="58" cy="58" r="3" fill="#333"/>
              <ellipse cx="50" cy="63" rx="4" ry="3" fill="#ffcc00"/>
            </svg>
          ),
          Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
          Arrow: ({ dir }) => (
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" className={dir === 'left' ? '' : 'rotate-180'}>
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          ),
          Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>,
          Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
          Save: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
          Link: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
          External: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
          Folder: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        };

        const App = () => {
          const [lang, setLang] = useState('pt');
          const [closetName, setClosetName] = useState('GALORE CLOSET');
          const [isEditingName, setIsEditingName] = useState(false);
          const [items, setItems] = useState([]);
          const [wishlist, setWishlist] = useState([]);
          const [savedOutfits, setSavedOutfits] = useState([]);
          const [activeTab, setActiveTab] = useState('dresser'); 
          const [indices, setIndices] = useState({ Top: 0, Bottom: 0, Shoes: 0, Dress: 0 });
          const [isDressMode, setIsDressMode] = useState(false);
          const [isLoaded, setIsLoaded] = useState(false);

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [isOutfitModalOpen, setIsOutfitModalOpen] = useState(false);
          const [isWishlistModalOpen, setIsWishlistModalOpen] = useState(false);
          
          const [outfitName, setOutfitName] = useState('');
          const [newItem, setNewItem] = useState({ name: '', category: 'Top', image: '', zoom: 110, offsetY: 0 });
          const [wishItem, setWishItem] = useState({ name: '', link: '', image: '' });

          useEffect(() => {
            const savedData = localStorage.getItem('closet_data');
            if (savedData) {
              const parsed = JSON.parse(savedData);
              setItems(parsed.items || []);
              setWishlist(parsed.wishlist || []);
              setSavedOutfits(parsed.savedOutfits || []);
              setClosetName(parsed.closetName || 'GALORE CLOSET');
            }
            setIsLoaded(true);
          }, []);

          useEffect(() => {
            if (isLoaded) {
              const dataToSave = { items, wishlist, savedOutfits, closetName };
              localStorage.setItem('closet_data', JSON.stringify(dataToSave));
            }
          }, [items, wishlist, savedOutfits, closetName, isLoaded]);

          const translations = {
            pt: {
              vestir: "VESTIR", itens: "ITENS", looks: "COLEÇÃO", wishlist: "WISHLIST",
              modoSeparado: "✿ PEÇAS SEPARADAS ✿", modoVestido: "✿ MODO VESTIDO ✿",
              vazio: "ESTÁ VAZIO... ✿", novoItem: "NOVO ITEM", cancelar: "CANCELAR",
              salvar: "SALVAR", foto: "ADICIONAR FOTO", nomePeca: "NOME DA PEÇA...",
              salvarLook: "SALVAR LOOK", nomeLook: "NOME DO LOOK...",
              idioma: "MUDAR PARA INGLÊS", addWish: "ADICIONAR DESEJO",
              linkCompra: "LINK (URL)...", comprar: "COMPRAR", historia: "HISTÓRICO"
            },
            en: {
              vestir: "DRESS", itens: "ITEMS", looks: "COLLECTION", wishlist: "WISHES",
              modoSeparado: "✿ SEPARATES ✿", modoVestido: "✿ DRESS MODE ✿",
              vazio: "IT'S EMPTY... ✿", novoItem: "NEW ITEM", cancelar: "CANCEL",
              salvar: "SAVE", foto: "ADD PHOTO", nomePeca: "ITEM NAME...",
              salvarLook: "SAVE OUTFIT", nomeLook: "OUTFIT NAME...",
              idioma: "CHANGE TO PORTUGUESE", addWish: "ADD TO WISHES",
              linkCompra: "LINK (URL)...", comprar: "SHOP", historia: "HISTORY"
            }
          };

          const t = translations[lang];

          const categorized = useMemo(() => ({
            Top: items.filter(i => i.category === 'Top'),
            Bottom: items.filter(i => i.category === 'Bottom'),
            Shoes: items.filter(i => i.category === 'Shoes'),
            Dress: items.filter(i => i.category === 'Dress'),
          }), [items]);

          const cycle = (cat, direction) => {
            const list = categorized[cat];
            if (!list || list.length === 0) return;
            setIndices(prev => {
              const curr = prev[cat] || 0;
              let next = direction === 'next' ? curr + 1 : curr - 1;
              if (next >= list.length) next = 0;
              if (next < 0) next = list.length - 1;
              return { ...prev, [cat]: next };
            });
          };

          const handleFileUpload = (e, target) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                if(target === 'closet') setNewItem(prev => ({ ...prev, image: reader.result }));
                if(target === 'wishlist') setWishItem(prev => ({ ...prev, image: reader.result }));
              };
              reader.readAsDataURL(file);
            }
          };

          const saveCurrentOutfit = () => {
            if (!outfitName) return;
            const currentOutfit = {
              id: Date.now(),
              name: outfitName,
              date: new Date().toLocaleDateString(),
              items: isDressMode 
                ? [categorized.Dress[indices.Dress], categorized.Shoes[indices.Shoes]]
                : [categorized.Top[indices.Top], categorized.Bottom[indices.Bottom], categorized.Shoes[indices.Shoes]]
            };
            setSavedOutfits([currentOutfit, ...savedOutfits]);
            setOutfitName('');
            setIsOutfitModalOpen(false);
          };

          if (!isLoaded) return <div className="min-h-screen bg-pink-100 flex items-center justify-center text-pink-500 font-black">CARREGANDO CLOSET...</div>;

          return (
            <div className="min-h-screen bg-pattern pb-24 text-pink-600">
              <style>{styleSheet}</style>

              <header className="bg-pink-100 border-b-[6px] border-pink-300 p-6 sticky top-0 z-50 rounded-b-[3.5rem] shadow-lg">
                <div className="max-w-md mx-auto flex justify-between items-center">
                  <div className="flex flex-col">
                    <div className="flex items-center gap-2" onClick={() => setIsEditingName(true)}>
                      <Icons.HelloKitty />
                      {isEditingName ? (
                        <input autoFocus className="bg-white/50 border-b-2 border-pink-500 outline-none text-lg font-black text-pink-500 uppercase w-32" value={closetName} onChange={(e) => setClosetName(e.target.value)} onBlur={() => setIsEditingName(false)} />
                      ) : (
                        <h1 className="text-lg font-black tracking-tighter text-pink-500 uppercase flex items-center gap-2">{closetName} <Icons.Edit /></h1>
                      )}
                    </div>
                    <button onClick={() => setLang(lang === 'pt' ? 'en' : 'pt')} className="text-[9px] font-black text-pink-400 mt-1 uppercase">{t.idioma}</button>
                  </div>
                  <button onClick={() => activeTab === 'wishlist' ? setIsWishlistModalOpen(true) : setIsModalOpen(true)} className="bg-pink-500 text-white w-12 h-12 rounded-2xl border-4 border-white shadow-lg flex items-center justify-center active:scale-90 transition-transform"><Icons.Plus /></button>
                </div>
              </header>

              <main className="max-w-md mx-auto p-4 pt-6">
                <div className="grid grid-cols-4 gap-2 mb-8">
                  <TabBtn active={activeTab === 'dresser'} onClick={() => setActiveTab('dresser')} label={t.vestir} />
                  <TabBtn active={activeTab === 'gallery'} onClick={() => setActiveTab('gallery')} label={t.itens} />
                  <TabBtn active={activeTab === 'looks'} onClick={() => setActiveTab('looks')} label={t.looks} />
                  <TabBtn active={activeTab === 'wishlist'} onClick={() => setActiveTab('wishlist')} label={t.wishlist} />
                </div>

                {activeTab === 'dresser' && (
                  <div className="flex flex-col items-center space-y-6 animate-pop">
                    <div className="flex gap-2 w-full">
                      <button onClick={() => setIsDressMode(!isDressMode)} className="flex-1 py-4 bg-white border-4 border-pink-300 rounded-[2rem] font-black text-pink-500 shadow-sm">{isDressMode ? t.modoSeparado : t.modoVestido}</button>
                      <button onClick={() => setIsOutfitModalOpen(true)} className="bg-pink-500 text-white px-6 rounded-[2rem] border-4 border-white shadow-md active:scale-95"><Icons.Save /></button>
                    </div>

                    <div className="w-full space-y-4 bg-pink-100/60 p-6 rounded-[4rem] border-4 border-white shadow-xl relative overflow-hidden">
                      {!isDressMode ? (
                        <>
                          <SimsSlot title="TOP" cat="Top" height="h-64" list={categorized.Top} idx={indices.Top} onCycle={cycle} />
                          <SimsSlot title="BOTTOM" cat="Bottom" height="h-72" list={categorized.Bottom} idx={indices.Bottom} onCycle={cycle} />
                        </>
                      ) : (
                        <SimsSlot title="DRESS" cat="Dress" height="h-[480px]" list={categorized.Dress} idx={indices.Dress} onCycle={cycle} />
                      )}
                      <SimsSlot title="SHOES" cat="Shoes" height="h-44" list={categorized.Shoes} idx={indices.Shoes} onCycle={cycle} />
                    </div>
                  </div>
                )}

                {activeTab === 'gallery' && (
                  <div className="columns-2 gap-4 space-y-4 animate-pop">
                    {items.map(i => (
                      <div key={i.id} className="bg-white p-3 rounded-[2rem] border-4 border-pink-100 shadow-sm pinterest-card group">
                        <div className="rounded-[1.5rem] overflow-hidden bg-pink-50 aspect-[3/4]">
                          <img src={i.image} className="w-full h-full object-cover" />
                        </div>
                        <div className="mt-2 flex justify-between items-center px-1">
                          <span className="text-[9px] font-black text-pink-500 truncate uppercase">{i.name}</span>
                          <button onClick={() => setItems(items.filter(x => x.id !== i.id))} className="text-pink-200 hover:text-red-400"><Icons.Trash /></button>
                        </div>
                      </div>
                    ))}
                    {items.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}

                {activeTab === 'looks' && (
                  <div className="space-y-6 animate-pop">
                    <h2 className="text-center font-black text-pink-300 text-[10px] tracking-widest flex items-center justify-center gap-2 uppercase"><Icons.Folder /> {t.historia}</h2>
                    <div className="columns-2 gap-4 space-y-6">
                      {savedOutfits.map(outfit => (
                        <div key={outfit.id} className="look-stack pinterest-card">
                          <div className="bg-white p-2 rounded-[2.5rem] border-4 border-pink-100 shadow-md">
                            <div className="grid grid-cols-2 gap-1 rounded-2xl overflow-hidden bg-pink-50 h-36">
                              {outfit.items.slice(0, 4).map((item, idx) => (
                                <div key={idx} className="bg-white overflow-hidden border-[1px] border-pink-50">
                                  <img src={item.image} className="w-full h-full object-cover" />
                                </div>
                              ))}
                            </div>
                            <div className="mt-3 px-2">
                              <p className="text-[10px] font-black text-pink-500 truncate uppercase">{outfit.name}</p>
                              <div className="flex justify-between items-center mt-1">
                                <span className="text-[7px] font-bold text-pink-300">{outfit.date}</span>
                                <button onClick={() => setSavedOutfits(savedOutfits.filter(o => o.id !== outfit.id))} className="text-pink-100"><Icons.Trash /></button>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                    {savedOutfits.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}

                {activeTab === 'wishlist' && (
                  <div className="columns-2 gap-4 space-y-4 animate-pop">
                    {wishlist.map(w => (
                      <div key={w.id} className="bg-white p-3 rounded-[2.5rem] border-4 border-pink-100 shadow-sm pinterest-card">
                        <div className="rounded-[2rem] overflow-hidden bg-pink-50 relative group">
                          <img src={w.image} className="w-full h-auto object-cover" />
                          {w.link && (
                            <a href={w.link.startsWith('http') ? w.link : `https://${w.link}`} target="_blank" className="absolute bottom-2 right-2 bg-pink-500 text-white p-2 rounded-full shadow-lg"><Icons.External /></a>
                          )}
                        </div>
                        <div className="mt-2 space-y-2 px-1">
                          <p className="text-[10px] font-black text-pink-500 uppercase leading-tight truncate">{w.name}</p>
                          <div className="flex justify-between items-center">
                            <button onClick={() => w.link && window.open(w.link, '_blank')} className="bg-pink-100 text-pink-500 text-[8px] font-black px-3 py-1 rounded-full uppercase flex items-center gap-1"><Icons.Link /> {t.comprar}</button>
                            <button onClick={() => setWishlist(wishlist.filter(x => x.id !== w.id))} className="text-pink-100"><Icons.Trash /></button>
                          </div>
                        </div>
                      </div>
                    ))}
                    {wishlist.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}
              </main>

              {isModalOpen && (
                <Modal onClose={() => setIsModalOpen(false)} title={t.novoItem} icon={<Icons.MyMelody/>}>
                    <div className="flex flex-wrap gap-2 justify-center mb-4">
                      {['Top', 'Bottom', 'Dress', 'Shoes'].map(c => (
                        <button key={c} onClick={() => setNewItem({...newItem, category: c})} className={`px-4 py-2 rounded-full text-[9px] font-black border-2 transition-all ${newItem.category === c ? 'bg-pink-500 border-pink-500 text-white' : 'bg-pink-50 border-pink-100 text-pink-300'}`}>{c.toUpperCase()}</button>
                      ))}
                    </div>
                    <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4 relative" onClick={() => document.getElementById('file-upload').click()}>
                      {newItem.image ? <img src={newItem.image} className="w-full h-full object-cover" /> : <div className="text-pink-200 flex flex-col items-center"><Icons.Plus /><span className="text-[10px] font-black mt-2">{t.foto}</span></div>}
                      <input id="file-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'closet')} />
                    </div>
                    <input placeholder={t.nomePeca} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-4" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value.toUpperCase()})} />
                    <div className="flex gap-4">
                      <button onClick={() => setIsModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                      <button onClick={() => { if(!newItem.image || !newItem.name) return; setItems([{...newItem, id: Date.now()}, ...items]); setIsModalOpen(false); setNewItem({ name: '', category: 'Top', image: '', zoom: 110, offsetY: 0 }); }} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg uppercase text-xs">SALVAR</button>
                    </div>
                </Modal>
              )}

              {isWishlistModalOpen && (
                <Modal onClose={() => setIsWishlistModalOpen(false)} title={t.addWish} icon={<Icons.HelloKitty/>}>
                    <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4" onClick={() => document.getElementById('wish-upload').click()}>
                      {wishItem.image ? <img src={wishItem.image} className="w-full h-full object-cover" /> : <div className="text-pink-200 flex flex-col items-center"><Icons.Plus /><span className="text-[10px] font-black mt-2">{t.foto}</span></div>}
                      <input id="wish-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'wishlist')} />
                    </div>
                    <input placeholder={t.nomePeca} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-3" value={wishItem.name} onChange={e => setWishItem({...wishItem, name: e.target.value.toUpperCase()})} />
                    <input placeholder={t.linkCompra} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-300 font-black border-2 border-pink-100 outline-none mb-4" value={wishItem.link} onChange={e => setWishItem({...wishItem, link: e.target.value})} />
                    <div className="flex gap-4">
                      <button onClick={() => setIsWishlistModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                      <button onClick={() => { if(!wishItem.image || !wishItem.name) return; setWishlist([{...wishItem, id: Date.now()}, ...wishlist]); setIsWishlistModalOpen(false); setWishItem({ name: '', link: '', image: '' }); }} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg uppercase text-xs">ADICIONAR</button>
                    </div>
                </Modal>
              )}

              {isOutfitModalOpen && (
                <Modal onClose={() => setIsOutfitModalOpen(false)} title={t.salvarLook} icon={<Icons.HelloKitty/>}>
                     <input autoFocus placeholder={t.nomeLook} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-600 font-black border-2 border-pink-100 outline-none text-center mb-6" value={outfitName} onChange={e => setOutfitName(e.target.value.toUpperCase())} />
                     <div className="flex gap-4">
                        <button onClick={() => setIsOutfitModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                        <button onClick={saveCurrentOutfit} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-xl text-xs">OK</button>
                     </div>
                </Modal>
              )}
            </div>
          );
        };

        const Modal = ({ children, title, icon, onClose }) => (
          <div className="fixed inset-0 bg-pink-400/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-4">
            <div className="bg-white w-full max-w-sm rounded-[3.5rem] border-[8px] border-white shadow-2xl p-8 mb-4 sm:mb-0">
              <div className="flex justify-center mb-2">{icon}</div>
              <h2 className="text-center font-black text-pink-500 uppercase mb-6 tracking-widest">{title}</h2>
              {children}
            </div>
          </div>
        );

        const TabBtn = ({ active, onClick, label }) => (
          <button onClick={onClick} className={`py-3 px-1 rounded-2xl font-black text-[9px] border-b-4 transition-all text-center ${active ? 'bg-pink-500 text-white border-pink-700 -translate-y-1 shadow-lg' : 'bg-pink-200 text-pink-500 border-pink-300'}`}>
            {label}
          </button>
        );

        const SimsSlot = ({ title, cat, height, list, idx, onCycle }) => (
          <div className="w-full relative group">
            <div className={`relative ${height} bg-white rounded-[3rem] border-[6px] border-white shadow-inner overflow-hidden flex items-center justify-center`}>
              <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10 bg-pink-500 text-white px-5 py-1 rounded-full text-[9px] font-black tracking-widest shadow-sm">
                {title}
              </div>
              {list.length > 0 ? (
                <>
                  <img src={list[idx].image} className="w-full h-full object-cover" />
                  <div className="absolute inset-x-2 top-1/2 -translate-y-1/2 flex justify-between px-1">
                    <button onClick={() => onCycle(cat, 'prev')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="left" /></button>
                    <button onClick={() => onCycle(cat, 'next')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="next" /></button>
                  </div>
                </>
              ) : (
                <div className="h-full flex flex-col items-center justify-center text-pink-200 opacity-40">
                  <Icons.Plus /><span className="text-[10px] font-black mt-2">VAZIO</span>
                </div>
              )}
            </div>
          </div>
        );

        const EmptyState = ({ t }) => (
          <div className="col-span-full py-20 text-center text-pink-200 font-black italic flex flex-col items-center">
            <Icons.MyMelody /><span className="mt-4">{t.vazio}</span>
          </div>
        );

        // INICIALIZAÇÃO DO REACT NO NAVEGADOR
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galore Closet</title>
    <!-- Scripts necessários para o seu código React funcionar no navegador -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // O TEU CÓDIGO ORIGINAL COMEÇA AQUI
        const { useState, useMemo, useEffect } = React;

        const styleSheet = `
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap');

        body {
          font-family: 'Quicksand', sans-serif;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
        }

        .bg-pattern {
          background-color: #fff0f6;
          background-image: radial-gradient(#ffb3d9 1.5px, transparent 1.5px);
          background-size: 24px 24px;

        .pinterest-card {
          break-inside: avoid;
          margin-bottom: 1.5rem;
        }

        .scroll-hide::-webkit-scrollbar {
          display: none;
        }

        .active-tab-glow {
          box-shadow: 0 0 15px rgba(255, 77, 148, 0.4);
        }

        .look-stack {
          position: relative;
        }

        .look-stack::before {
          content: '';
          position: absolute;
          top: -8px;
          left: 8px;
          right: 8px;
          bottom: 8px;
          background: white;
          border-radius: 2rem;
          z-index: -1;
          box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        @keyframes pop {
          0% { transform: scale(0.95); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
          animation: pop 0.3s ease-out forwards;
        }
        `;

        const Icons = {
          HelloKitty: () => (
            <svg width="35" height="35" viewBox="0 0 100 100" fill="none">
              <path d="M50 85c25 0 40-15 40-30s-10-30-40-30-40 15-40 30 15 30 40 30z" fill="white" stroke="#ff85c0" strokeWidth="4"/>
              <path d="M25 35c0-10 5-20 15-20l5 10c0 0-10 0-20 10z" fill="#ff4d94" stroke="#ff4d94" strokeWidth="2"/>
              <circle cx="35" cy="50" r="4" fill="#333"/>
              <circle cx="65" cy="50" r="4" fill="#333"/>
              <ellipse cx="50" cy="58" rx="6" ry="4" fill="#ffcc00"/>
            </svg>
          ),
          MyMelody: () => (
            <svg width="30" height="30" viewBox="0 0 100 100" fill="none">
              <path d="M50 90c20 0 35-15 35-35 0-15-5-25-15-30V15c0-5-5-10-10-10H40c-5 0-10 5-10 10v10c-10 5-15 15-15 30 0 20 15 35 35 35z" fill="#ff85c0" stroke="#ff4d94" strokeWidth="3"/>
              <rect x="35" y="45" width="30" height="25" rx="15" fill="white" />
              <circle cx="42" cy="58" r="3" fill="#333"/>
              <circle cx="58" cy="58" r="3" fill="#333"/>
              <ellipse cx="50" cy="63" rx="4" ry="3" fill="#ffcc00"/>
            </svg>
          ),
          Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
          Arrow: ({ dir }) => (
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" className={dir === 'left' ? '' : 'rotate-180'}>
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          ),
          Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>,
          Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
          Save: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
          Link: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
          External: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>,
          Folder: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        };

        const App = () => {
          const [lang, setLang] = useState('pt');
          const [closetName, setClosetName] = useState('GALORE CLOSET');
          const [isEditingName, setIsEditingName] = useState(false);
          const [items, setItems] = useState([]);
          const [wishlist, setWishlist] = useState([]);
          const [savedOutfits, setSavedOutfits] = useState([]);
          const [activeTab, setActiveTab] = useState('dresser'); 
          const [indices, setIndices] = useState({ Top: 0, Bottom: 0, Shoes: 0, Dress: 0 });
          const [isDressMode, setIsDressMode] = useState(false);
          const [isLoaded, setIsLoaded] = useState(false);

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [isOutfitModalOpen, setIsOutfitModalOpen] = useState(false);
          const [isWishlistModalOpen, setIsWishlistModalOpen] = useState(false);
          
          const [outfitName, setOutfitName] = useState('');
          const [newItem, setNewItem] = useState({ name: '', category: 'Top', image: '', zoom: 110, offsetY: 0 });
          const [wishItem, setWishItem] = useState({ name: '', link: '', image: '' });

          useEffect(() => {
            const savedData = localStorage.getItem('closet_data');
            if (savedData) {
              const parsed = JSON.parse(savedData);
              setItems(parsed.items || []);
              setWishlist(parsed.wishlist || []);
              setSavedOutfits(parsed.savedOutfits || []);
              setClosetName(parsed.closetName || 'GALORE CLOSET');
            }
            setIsLoaded(true);
          }, []);

          useEffect(() => {
            if (isLoaded) {
              const dataToSave = { items, wishlist, savedOutfits, closetName };
              localStorage.setItem('closet_data', JSON.stringify(dataToSave));
            }
          }, [items, wishlist, savedOutfits, closetName, isLoaded]);

          const translations = {
            pt: {
              vestir: "VESTIR", itens: "ITENS", looks: "COLEÇÃO", wishlist: "WISHLIST",
              modoSeparado: "✿ PEÇAS SEPARADAS ✿", modoVestido: "✿ MODO VESTIDO ✿",
              vazio: "ESTÁ VAZIO... ✿", novoItem: "NOVO ITEM", cancelar: "CANCELAR",
              salvar: "SALVAR", foto: "ADICIONAR FOTO", nomePeca: "NOME DA PEÇA...",
              salvarLook: "SALVAR LOOK", nomeLook: "NOME DO LOOK...",
              idioma: "MUDAR PARA INGLÊS", addWish: "ADICIONAR DESEJO",
              linkCompra: "LINK (URL)...", comprar: "COMPRAR", historia: "HISTÓRICO"
            },
            en: {
              vestir: "DRESS", itens: "ITEMS", looks: "COLLECTION", wishlist: "WISHES",
              modoSeparado: "✿ SEPARATES ✿", modoVestido: "✿ DRESS MODE ✿",
              vazio: "IT'S EMPTY... ✿", novoItem: "NEW ITEM", cancelar: "CANCEL",
              salvar: "SAVE", foto: "ADD PHOTO", nomePeca: "ITEM NAME...",
              salvarLook: "SAVE OUTFIT", nomeLook: "OUTFIT NAME...",
              idioma: "CHANGE TO PORTUGUESE", addWish: "ADD TO WISHES",
              linkCompra: "LINK (URL)...", comprar: "SHOP", historia: "HISTORY"
            }
          };

          const t = translations[lang];

          const categorized = useMemo(() => ({
            Top: items.filter(i => i.category === 'Top'),
            Bottom: items.filter(i => i.category === 'Bottom'),
            Shoes: items.filter(i => i.category === 'Shoes'),
            Dress: items.filter(i => i.category === 'Dress'),
          }), [items]);

          const cycle = (cat, direction) => {
            const list = categorized[cat];
            if (!list || list.length === 0) return;
            setIndices(prev => {
              const curr = prev[cat] || 0;
              let next = direction === 'next' ? curr + 1 : curr - 1;
              if (next >= list.length) next = 0;
              if (next < 0) next = list.length - 1;
              return { ...prev, [cat]: next };
            });
          };

          const handleFileUpload = (e, target) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                if(target === 'closet') setNewItem(prev => ({ ...prev, image: reader.result }));
                if(target === 'wishlist') setWishItem(prev => ({ ...prev, image: reader.result }));
              };
              reader.readAsDataURL(file);
            }
          };

          const saveCurrentOutfit = () => {
            if (!outfitName) return;
            const currentOutfit = {
              id: Date.now(),
              name: outfitName,
              date: new Date().toLocaleDateString(),
              items: isDressMode 
                ? [categorized.Dress[indices.Dress], categorized.Shoes[indices.Shoes]]
                : [categorized.Top[indices.Top], categorized.Bottom[indices.Bottom], categorized.Shoes[indices.Shoes]]
            };
            setSavedOutfits([currentOutfit, ...savedOutfits]);
            setOutfitName('');
            setIsOutfitModalOpen(false);
          };

          if (!isLoaded) return <div className="min-h-screen bg-pink-100 flex items-center justify-center text-pink-500 font-black">CARREGANDO CLOSET...</div>;

          return (
            <div className="min-h-screen bg-pattern pb-24 text-pink-600">
              <style>{styleSheet}</style>

              <header className="bg-pink-100 border-b-[6px] border-pink-300 p-6 sticky top-0 z-50 rounded-b-[3.5rem] shadow-lg">
                <div className="max-w-md mx-auto flex justify-between items-center">
                  <div className="flex flex-col">
                    <div className="flex items-center gap-2" onClick={() => setIsEditingName(true)}>
                      <Icons.HelloKitty />
                      {isEditingName ? (
                        <input autoFocus className="bg-white/50 border-b-2 border-pink-500 outline-none text-lg font-black text-pink-500 uppercase w-32" value={closetName} onChange={(e) => setClosetName(e.target.value)} onBlur={() => setIsEditingName(false)} />
                      ) : (
                        <h1 className="text-lg font-black tracking-tighter text-pink-500 uppercase flex items-center gap-2">{closetName} <Icons.Edit /></h1>
                      )}
                    </div>
                    <button onClick={() => setLang(lang === 'pt' ? 'en' : 'pt')} className="text-[9px] font-black text-pink-400 mt-1 uppercase">{t.idioma}</button>
                  </div>
                  <button onClick={() => activeTab === 'wishlist' ? setIsWishlistModalOpen(true) : setIsModalOpen(true)} className="bg-pink-500 text-white w-12 h-12 rounded-2xl border-4 border-white shadow-lg flex items-center justify-center active:scale-90 transition-transform"><Icons.Plus /></button>
                </div>
              </header>

              <main className="max-w-md mx-auto p-4 pt-6">
                <div className="grid grid-cols-4 gap-2 mb-8">
                  <TabBtn active={activeTab === 'dresser'} onClick={() => setActiveTab('dresser')} label={t.vestir} />
                  <TabBtn active={activeTab === 'gallery'} onClick={() => setActiveTab('gallery')} label={t.itens} />
                  <TabBtn active={activeTab === 'looks'} onClick={() => setActiveTab('looks')} label={t.looks} />
                  <TabBtn active={activeTab === 'wishlist'} onClick={() => setActiveTab('wishlist')} label={t.wishlist} />
                </div>

                {activeTab === 'dresser' && (
                  <div className="flex flex-col items-center space-y-6 animate-pop">
                    <div className="flex gap-2 w-full">
                      <button onClick={() => setIsDressMode(!isDressMode)} className="flex-1 py-4 bg-white border-4 border-pink-300 rounded-[2rem] font-black text-pink-500 shadow-sm">{isDressMode ? t.modoSeparado : t.modoVestido}</button>
                      <button onClick={() => setIsOutfitModalOpen(true)} className="bg-pink-500 text-white px-6 rounded-[2rem] border-4 border-white shadow-md active:scale-95"><Icons.Save /></button>
                    </div>

                    <div className="w-full space-y-4 bg-pink-100/60 p-6 rounded-[4rem] border-4 border-white shadow-xl relative overflow-hidden">
                      {!isDressMode ? (
                        <>
                          <SimsSlot title="TOP" cat="Top" height="h-64" list={categorized.Top} idx={indices.Top} onCycle={cycle} />
                          <SimsSlot title="BOTTOM" cat="Bottom" height="h-72" list={categorized.Bottom} idx={indices.Bottom} onCycle={cycle} />
                        </>
                      ) : (
                        <SimsSlot title="DRESS" cat="Dress" height="h-[480px]" list={categorized.Dress} idx={indices.Dress} onCycle={cycle} />
                      )}
                      <SimsSlot title="SHOES" cat="Shoes" height="h-44" list={categorized.Shoes} idx={indices.Shoes} onCycle={cycle} />
                    </div>
                  </div>
                )}

                {activeTab === 'gallery' && (
                  <div className="columns-2 gap-4 space-y-4 animate-pop">
                    {items.map(i => (
                      <div key={i.id} className="bg-white p-3 rounded-[2rem] border-4 border-pink-100 shadow-sm pinterest-card group">
                        <div className="rounded-[1.5rem] overflow-hidden bg-pink-50 aspect-[3/4]">
                          <img src={i.image} className="w-full h-full object-cover" />
                        </div>
                        <div className="mt-2 flex justify-between items-center px-1">
                          <span className="text-[9px] font-black text-pink-500 truncate uppercase">{i.name}</span>
                          <button onClick={() => setItems(items.filter(x => x.id !== i.id))} className="text-pink-200 hover:text-red-400"><Icons.Trash /></button>
                        </div>
                      </div>
                    ))}
                    {items.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}

                {activeTab === 'looks' && (
                  <div className="space-y-6 animate-pop">
                    <h2 className="text-center font-black text-pink-300 text-[10px] tracking-widest flex items-center justify-center gap-2 uppercase"><Icons.Folder /> {t.historia}</h2>
                    <div className="columns-2 gap-4 space-y-6">
                      {savedOutfits.map(outfit => (
                        <div key={outfit.id} className="look-stack pinterest-card">
                          <div className="bg-white p-2 rounded-[2.5rem] border-4 border-pink-100 shadow-md">
                            <div className="grid grid-cols-2 gap-1 rounded-2xl overflow-hidden bg-pink-50 h-36">
                              {outfit.items.slice(0, 4).map((item, idx) => (
                                <div key={idx} className="bg-white overflow-hidden border-[1px] border-pink-50">
                                  <img src={item.image} className="w-full h-full object-cover" />
                                </div>
                              ))}
                            </div>
                            <div className="mt-3 px-2">
                              <p className="text-[10px] font-black text-pink-500 truncate uppercase">{outfit.name}</p>
                              <div className="flex justify-between items-center mt-1">
                                <span className="text-[7px] font-bold text-pink-300">{outfit.date}</span>
                                <button onClick={() => setSavedOutfits(savedOutfits.filter(o => o.id !== outfit.id))} className="text-pink-100"><Icons.Trash /></button>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                    {savedOutfits.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}

                {activeTab === 'wishlist' && (
                  <div className="columns-2 gap-4 space-y-4 animate-pop">
                    {wishlist.map(w => (
                      <div key={w.id} className="bg-white p-3 rounded-[2.5rem] border-4 border-pink-100 shadow-sm pinterest-card">
                        <div className="rounded-[2rem] overflow-hidden bg-pink-50 relative group">
                          <img src={w.image} className="w-full h-auto object-cover" />
                          {w.link && (
                            <a href={w.link.startsWith('http') ? w.link : `https://${w.link}`} target="_blank" className="absolute bottom-2 right-2 bg-pink-500 text-white p-2 rounded-full shadow-lg"><Icons.External /></a>
                          )}
                        </div>
                        <div className="mt-2 space-y-2 px-1">
                          <p className="text-[10px] font-black text-pink-500 uppercase leading-tight truncate">{w.name}</p>
                          <div className="flex justify-between items-center">
                            <button onClick={() => w.link && window.open(w.link, '_blank')} className="bg-pink-100 text-pink-500 text-[8px] font-black px-3 py-1 rounded-full uppercase flex items-center gap-1"><Icons.Link /> {t.comprar}</button>
                            <button onClick={() => setWishlist(wishlist.filter(x => x.id !== w.id))} className="text-pink-100"><Icons.Trash /></button>
                          </div>
                        </div>
                      </div>
                    ))}
                    {wishlist.length === 0 && <EmptyState t={t}/>}
                  </div>
                )}
              </main>

              {isModalOpen && (
                <Modal onClose={() => setIsModalOpen(false)} title={t.novoItem} icon={<Icons.MyMelody/>}>
                    <div className="flex flex-wrap gap-2 justify-center mb-4">
                      {['Top', 'Bottom', 'Dress', 'Shoes'].map(c => (
                        <button key={c} onClick={() => setNewItem({...newItem, category: c})} className={`px-4 py-2 rounded-full text-[9px] font-black border-2 transition-all ${newItem.category === c ? 'bg-pink-500 border-pink-500 text-white' : 'bg-pink-50 border-pink-100 text-pink-300'}`}>{c.toUpperCase()}</button>
                      ))}
                    </div>
                    <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4 relative" onClick={() => document.getElementById('file-upload').click()}>
                      {newItem.image ? <img src={newItem.image} className="w-full h-full object-cover" /> : <div className="text-pink-200 flex flex-col items-center"><Icons.Plus /><span className="text-[10px] font-black mt-2">{t.foto}</span></div>}
                      <input id="file-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'closet')} />
                    </div>
                    <input placeholder={t.nomePeca} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-4" value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value.toUpperCase()})} />
                    <div className="flex gap-4">
                      <button onClick={() => setIsModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                      <button onClick={() => { if(!newItem.image || !newItem.name) return; setItems([{...newItem, id: Date.now()}, ...items]); setIsModalOpen(false); setNewItem({ name: '', category: 'Top', image: '', zoom: 110, offsetY: 0 }); }} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg uppercase text-xs">SALVAR</button>
                    </div>
                </Modal>
              )}

              {isWishlistModalOpen && (
                <Modal onClose={() => setIsWishlistModalOpen(false)} title={t.addWish} icon={<Icons.HelloKitty/>}>
                    <div className="aspect-square bg-pink-50 border-4 border-dashed border-pink-200 rounded-[2.5rem] flex items-center justify-center overflow-hidden mb-4" onClick={() => document.getElementById('wish-upload').click()}>
                      {wishItem.image ? <img src={wishItem.image} className="w-full h-full object-cover" /> : <div className="text-pink-200 flex flex-col items-center"><Icons.Plus /><span className="text-[10px] font-black mt-2">{t.foto}</span></div>}
                      <input id="wish-upload" type="file" hidden accept="image/*" onChange={(e) => handleFileUpload(e, 'wishlist')} />
                    </div>
                    <input placeholder={t.nomePeca} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-500 font-black border-2 border-pink-100 outline-none mb-3" value={wishItem.name} onChange={e => setWishItem({...wishItem, name: e.target.value.toUpperCase()})} />
                    <input placeholder={t.linkCompra} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-300 font-black border-2 border-pink-100 outline-none mb-4" value={wishItem.link} onChange={e => setWishItem({...wishItem, link: e.target.value})} />
                    <div className="flex gap-4">
                      <button onClick={() => setIsWishlistModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                      <button onClick={() => { if(!wishItem.image || !wishItem.name) return; setWishlist([{...wishItem, id: Date.now()}, ...wishlist]); setIsWishlistModalOpen(false); setWishItem({ name: '', link: '', image: '' }); }} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-lg uppercase text-xs">ADICIONAR</button>
                    </div>
                </Modal>
              )}

              {isOutfitModalOpen && (
                <Modal onClose={() => setIsOutfitModalOpen(false)} title={t.salvarLook} icon={<Icons.HelloKitty/>}>
                     <input autoFocus placeholder={t.nomeLook} className="w-full p-4 bg-pink-50 rounded-2xl text-pink-600 font-black border-2 border-pink-100 outline-none text-center mb-6" value={outfitName} onChange={e => setOutfitName(e.target.value.toUpperCase())} />
                     <div className="flex gap-4">
                        <button onClick={() => setIsOutfitModalOpen(false)} className="flex-1 font-black text-pink-200 uppercase text-xs">{t.cancelar}</button>
                        <button onClick={saveCurrentOutfit} className="flex-[2] bg-pink-500 text-white py-4 rounded-[2rem] font-black shadow-xl text-xs">OK</button>
                     </div>
                </Modal>
              )}
            </div>
          );
        };

        const Modal = ({ children, title, icon, onClose }) => (
          <div className="fixed inset-0 bg-pink-400/80 backdrop-blur-md z-[100] flex items-end sm:items-center justify-center p-4">
            <div className="bg-white w-full max-w-sm rounded-[3.5rem] border-[8px] border-white shadow-2xl p-8 mb-4 sm:mb-0">
              <div className="flex justify-center mb-2">{icon}</div>
              <h2 className="text-center font-black text-pink-500 uppercase mb-6 tracking-widest">{title}</h2>
              {children}
            </div>
          </div>
        );

        const TabBtn = ({ active, onClick, label }) => (
          <button onClick={onClick} className={`py-3 px-1 rounded-2xl font-black text-[9px] border-b-4 transition-all text-center ${active ? 'bg-pink-500 text-white border-pink-700 -translate-y-1 shadow-lg' : 'bg-pink-200 text-pink-500 border-pink-300'}`}>
            {label}
          </button>
        );

        const SimsSlot = ({ title, cat, height, list, idx, onCycle }) => (
          <div className="w-full relative group">
            <div className={`relative ${height} bg-white rounded-[3rem] border-[6px] border-white shadow-inner overflow-hidden flex items-center justify-center`}>
              <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10 bg-pink-500 text-white px-5 py-1 rounded-full text-[9px] font-black tracking-widest shadow-sm">
                {title}
              </div>
              {list.length > 0 ? (
                <>
                  <img src={list[idx].image} className="w-full h-full object-cover" />
                  <div className="absolute inset-x-2 top-1/2 -translate-y-1/2 flex justify-between px-1">
                    <button onClick={() => onCycle(cat, 'prev')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="left" /></button>
                    <button onClick={() => onCycle(cat, 'next')} className="bg-white/80 text-pink-400 p-2 rounded-full border-2 border-pink-100 active:scale-75 transition-transform"><Icons.Arrow dir="next" /></button>
                  </div>
                </>
              ) : (
                <div className="h-full flex flex-col items-center justify-center text-pink-200 opacity-40">
                  <Icons.Plus /><span className="text-[10px] font-black mt-2">VAZIO</span>
                </div>
              )}
            </div>
          </div>
        );

        const EmptyState = ({ t }) => (
          <div className="col-span-full py-20 text-center text-pink-200 font-black italic flex flex-col items-center">
            <Icons.MyMelody /><span className="mt-4">{t.vazio}</span>
          </div>
        );

        // INICIALIZAÇÃO DO REACT NO NAVEGADOR
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
